<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#100E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg:#100E0D; --text:#EEE3DF; --text-dim:#B2A9A6;
    --key-num:#2A2522; --key-op:#413A37; --key-ac:#52443D; --key-ac-text:#E1CCC2; --op-glyph:#C8BDB8;
    --key-eq:#FFEBD5; --key-eq-glyph:#6D5433;
    --banner-force:#CC3300; --banner-settings:#004499;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); overscroll-behavior:none; }
  body { display:flex; flex-direction:column; height:100dvh; color:var(--text);
    font-family:"Google Sans", "Google Sans Text", "Product Sans", Roboto, system-ui, sans-serif; font-weight:400;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* top bar: history + overflow (decorative, like the real app) */
  #top { flex:none; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; color:var(--text-dim); }
  #top svg { width:24px; height:24px; fill:currentColor; display:block; }

  /* display: the big line is the equation while typing (the result once you press =); a smaller preview sits below it */
  #display-area { flex:1 1 0; min-height:0; position:relative; display:flex; flex-direction:column;
    justify-content:flex-end; align-items:flex-end; padding:0 24px 14px; overflow:hidden; }
  #main { color:var(--text); font-size:72px; line-height:1.2; max-width:100%; white-space:nowrap; overflow:hidden; font-weight:400; }
  #main.res { color:var(--key-eq); }
  #history { color:var(--key-eq); font-size:40px; line-height:52px; min-height:52px; max-width:100%; white-space:nowrap; overflow:hidden; margin-top:6px; }
  .banner { position:absolute; top:0; left:0; right:0; text-align:center; font-size:12px; font-weight:700;
    color:#fff; padding:4px 0; display:none; }
  #banner-force { background:var(--banner-force); } #banner-settings { background:var(--banner-settings); }
  #hit { position:absolute; inset:0; }

  #expander { flex:none; height:44px; padding:0 26px; display:flex; align-items:center; color:var(--text-dim); cursor:pointer; }
  #expander svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  body.sci #keys { flex-basis:74%; }
  body:not(.sci) .sci-row { display:none; }
  .sci-row button { font-size:28px; } .sci-row button.on { background:var(--key-ac); color:var(--key-ac-text); }
  #keys { flex:0 0 54%; display:flex; flex-direction:column; gap:8px; padding:0 4px 10px; min-height:0; }
  .row { flex:1 1 0; display:flex; gap:4px; min-height:0; }
  button { flex:1 1 0; border:0; border-radius:999px; font:inherit; font-size:38px; font-weight:400; color:var(--text);
    background:var(--key-num); min-width:0; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-radius .12s ease, filter .12s ease; }
  button:active { border-radius:28px; filter:brightness(1.35); }
  button svg { width:34px; height:34px; display:block; }
  button.op, button.fn { background:var(--key-op); color:var(--op-glyph); }
  button.ac { background:var(--key-ac); color:var(--key-ac-text); font-size:34px; font-weight:500; }
  button.eq { background:var(--key-eq); color:var(--key-eq-glyph); } button.eq:active { filter:brightness(.88); }
  #top svg { cursor:pointer; } #top .tb { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:none; flex:none; }
  #top .tb.on { background:#3b3330; color:var(--text); } #top { z-index:30; position:relative; }
  #menu { display:none; position:fixed; top:64px; right:14px; z-index:40; background:#2a2523; border-radius:26px; padding:10px 0; min-width:270px; box-shadow:0 6px 24px #000a; }
  #menu.open { display:block; } #menu div { display:flex; align-items:center; gap:22px; padding:0 26px; height:52px; font-size:19px; color:var(--text); cursor:pointer; }
  #menu svg { width:24px; height:24px; fill:#c8bdb8; flex:none; }
  #histpanel { display:none; position:fixed; left:0; right:0; top:0; z-index:20; flex-direction:column; background:var(--bg); }
  #histpanel.open { display:flex; }
  #hp-top { flex:1 1 0; min-height:0; background:#1d1917; padding:64px 24px 10px; overflow-y:auto; border-radius:0 0 28px 28px; }
  #hp-top .day { color:var(--text-dim); font-size:15px; margin:6px 0 10px; }
  #hp-top .it { text-align:right; margin-bottom:18px; } #hp-top .it .e { color:var(--text-dim); font-size:30px; } #hp-top .it .r { color:var(--text-dim); font-size:42px; }
  #hp-top .none { color:var(--text-dim); text-align:center; margin-top:40px; font-size:18px; }
  #hp-bot { flex:none; padding:0 24px 12px; text-align:right; }
  #hp-bot .grab { width:50px; height:5px; border-radius:3px; background:#6b625e; margin:10px auto 8px; }
  #hp-bot .lbl { text-align:left; color:var(--text); font-size:17px; margin-bottom:4px; }
  #hp-bot .m { font-size:56px; line-height:1.15; white-space:nowrap; overflow:hidden; } #hp-bot .m.res { color:var(--key-eq); }
  #hp-bot .s { font-size:34px; color:var(--key-eq); min-height:42px; }
  button .paren { font-weight:300; font-size:38px; letter-spacing:6px; }
</style>
</head>
<body>
<div id="top">
  <button class="tb" id="btn-hist" aria-label="History"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 2.06 4.94l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></button>
  <button class="tb" id="btn-menu" aria-label="More options"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
</div>
<div id="menu">
  <div data-m="clear"><svg viewBox="0 0 24 24"><path d="M4 5h9v2H4zM6 8h5v10H6zM15 11a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm.8 7.2L14 16.4V13h1.2v2.9l1.4 1.4z"/></svg>Clear history</div>
  <div data-m="x"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.9 1.4-1.9-.4-1 .3-2.1 1.4-2.1H17a4 4 0 0 0 4-4c0-5-4-10-9-10zM7 12a1.3 1.3 0 1 1 0-.01zm3-4a1.3 1.3 0 1 1 0-.01zm5 0a1.3 1.3 0 1 1 0-.01z"/></svg>Choose theme</div>
  <div data-m="x"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5zm0 5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm-4 9c1-1.5 2.5-2 4-2s3 .5 4 2c-1 1.5-2.5 2.4-4 2.9-1.5-.5-3-1.4-4-2.9z"/></svg>Privacy Policy</div>
  <div data-m="x"><svg viewBox="0 0 24 24"><path d="M20 8h-2.8a6 6 0 0 0-1.9-2.1L17 4.4 15.6 3l-2 2a6 6 0 0 0-3.2 0l-2-2L7 4.4l1.7 1.5A6 6 0 0 0 6.8 8H4v2h2v2H4v2h2v2H4v2h2.8a6 6 0 0 0 10.4 0H20v-2h-2v-2h2v-2h-2v-2h2zm-6 8h-4v-2h4zm0-4h-4v-2h4z"/></svg>Send feedback</div>
  <div data-m="x"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm2-7.5c-.5.8-1.4 1.1-1.8 1.8-.2.3-.2.7-.2 1.2h-2c0-1 .1-1.7.6-2.3.6-.8 1.6-1.1 1.6-2.1a1.4 1.4 0 0 0-2.8 0H8.5a3.5 3.5 0 0 1 7 0c0 .6-.2 1-.5 1.4z"/></svg>Help</div>
</div>
<div id="histpanel"><div id="hp-top"></div><div id="hp-bot"><div class="grab"></div><div class="lbl">Current expression</div><div class="m" id="hp-m"></div><div class="s" id="hp-s"></div></div></div>
<div id="display-area">
  <div class="banner" id="banner-force">SET FORCE NUMBER</div>
  <div class="banner" id="banner-settings">SETTINGS</div>
  <div id="main">0</div>
  <div id="history"></div>
  <div id="hit"></div>
</div>
<div id="expander"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="exp-path" d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></div>
<div id="keys">
  <div class="row sci-row"><button class="fn" data-k="√" id="k-sqrt">√</button><button class="fn" data-k="π">π</button><button class="fn" data-k="^">^</button><button class="fn" data-k="!">!</button></div>
  <div class="row sci-row"><button class="fn" data-k="Deg" id="k-deg">Deg</button><button class="fn" data-k="sin" id="k-sin">sin</button><button class="fn" data-k="cos" id="k-cos">cos</button><button class="fn" data-k="tan" id="k-tan">tan</button></div>
  <div class="row sci-row"><button class="fn" data-k="Inv" id="k-inv">Inv</button><button class="fn" data-k="e">e</button><button class="fn" data-k="ln" id="k-ln">ln</button><button class="fn" data-k="log" id="k-log">log</button></div>
  <div class="row">
    <button class="ac" data-k="AC" id="btn-ac">AC</button>
    <button class="fn" data-k="()" aria-label="parentheses"><span class="paren">( )</span></button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="÷" aria-label="divide"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="16" height="2" rx="1"/><circle cx="12" cy="6" r="1.7"/><circle cx="12" cy="18" r="1.7"/></svg></button>
  </div>
  <div class="row">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×" aria-label="multiply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="row">
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−" aria-label="minus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="row">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
  <div class="row">
    <button data-k="0">0</button><button data-k=".">.</button>
    <button data-k="⌫" aria-label="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.5h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-10l-6-6.5 6-6.5z"/><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"/></svg></button>
    <button class="eq" data-k="=" aria-label="equals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5.5 9.5h13M5.5 14.5h13"/></svg></button>
  </div>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="settings.js"></script>
<script>
(function () {
  "use strict";
  var CONFIG_KEY = "fc_calc_v1";        // this app's own settings
  var BUS_KEY = "fc_bus_v1";            // shared with other apps on this site (Notary reads this)
  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage ----------
  function loadConfig() { try { return JSON.parse(localStorage.getItem(CONFIG_KEY)); } catch (e) { return null; } }
  function saveConfig(c) { try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch (e) {} }

  // Everything this app records is published as an entry on a small shared "bus" so other apps
  // can pick it up: { source, bank, pattern, ts, fields }. Only the latest few are kept.
  function readBus() {
    var bus; try { bus = JSON.parse(localStorage.getItem(BUS_KEY)); } catch (e) { bus = null; }
    if (!bus || bus.v !== 1 || !Array.isArray(bus.entries)) bus = { v: 1, seq: 0, entries: [] };
    return bus;
  }
  function publish(record) {
    var bus = readBus();
    bus.seq += 1;
    bus.entries.push({ id: "forcecalc-" + bus.seq, seq: bus.seq, source: "forcecalc", bank: record.bank,
      pattern: record.pattern, ts: record.ts, fields: record.fields });
    if (bus.entries.length > 30) bus.entries = bus.entries.slice(-30);
    try { localStorage.setItem(BUS_KEY, JSON.stringify(bus)); } catch (e) {}
  }
  function clearBus() { try { localStorage.removeItem(BUS_KEY); } catch (e) {} }

  // ---------- notifications ----------
  function permission() { return ("Notification" in window) ? Notification.permission : "unsupported"; }
  function showNotification(title, text) {
    if (permission() !== "granted" || !navigator.serviceWorker) return Promise.resolve(false);
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return false;
      // like the original (fixed notification id) a new reveal replaces the previous one
      return reg.getNotifications().then(function (list) {
        list.forEach(function (n) { if (n.tag && n.tag.indexOf("forcecalc-") === 0) n.close(); });
        return reg.showNotification(title, { body: text, silent: true, tag: "forcecalc-" + Date.now(),
          icon: "icon-192.png", badge: "icon-192.png" });
      }).then(function () { return true; });
    }).catch(function () { return false; });
  }
  function requestPermission(cb) {
    try { var r = Notification.requestPermission(function () { cb && cb(); }); if (r && r.then) r.then(function () { cb && cb(); }); } catch (e) {}
  }

  // ---------- timers: keep the screen awake while a notification is waiting; catch up if frozen ----------
  var waiting = [];   // {fn, due, id}
  var wakeLock = null;
  function acquireLock() {
    try {
      if (!navigator.wakeLock || wakeLock) return;
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l; l.addEventListener("release", function () { if (wakeLock === l) wakeLock = null; });
      }, function () {});
    } catch (e) {}
  }
  function releaseLockIfIdle() {
    if (waiting.length) return;
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function schedule(fn, ms) {
    var rec = { due: Date.now() + ms, id: null };
    rec.fn = function () { var i = waiting.indexOf(rec); if (i >= 0) waiting.splice(i, 1); fn(); releaseLockIfIdle(); };
    rec.id = setTimeout(rec.fn, ms);
    waiting.push(rec); acquireLock();
    return rec;
  }
  function cancel(rec) {
    if (!rec) return;
    clearTimeout(rec.id);
    var i = waiting.indexOf(rec); if (i >= 0) waiting.splice(i, 1);
  }

  // ---------- calculation history (like the real calculator's) ----------
  var HIST_KEY = "fc_hist_v1";
  function loadHist() { try { var h = JSON.parse(localStorage.getItem(HIST_KEY)); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
  function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(-100))); } catch (e) {} }

  var settingsOpen = false;
  var calc = FCEngine.createCalc({
    evaluated: function (r) { var h = loadHist(); h.push({ e: r.expr, r: r.result }); saveHist(h); },
    now: function () { return Date.now(); },
    vibrate: function (ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} },
    schedule: schedule, cancel: cancel,
    notify: function (p) { showNotification(p.title, p.text); },
    publish: publish,
    loadConfig: loadConfig, saveConfig: saveConfig,
    notifyPermission: permission,
    requestNotifications: function () { requestPermission(paint); },
    testNotification: function () { showNotification("♈ Aries  ·  March 21", "Test notification"); },
    openSettings: function () { openSettings(); }
  }, { externalSettings: true });

  function openSettings() {
    if (settingsOpen) return;
    settingsOpen = true;
    FCSettings.open({
      calc: calc, engine: FCEngine, readBus: readBus, clearBus: clearBus,
      permission: permission, requestPermission: requestPermission,
      testNotification: function () { return showNotification("♈ Aries  ·  March 21", "Test notification"); },
      onClose: function () { settingsOpen = false; paint(); }
    });
  }

  // ---------- drawing ----------
  var canvasCtx = document.createElement("canvas").getContext("2d");
  var SIZES = [72, 60, 50, 42, 34, 28];
  function fitText(el, text, avail) {
    var fam = getComputedStyle(el).fontFamily, i, size = SIZES[SIZES.length - 1];
    for (i = 0; i < SIZES.length; i++) {
      canvasCtx.font = "400 " + SIZES[i] + "px " + fam;
      if (canvasCtx.measureText(text).width <= avail) { size = SIZES[i]; break; }
    }
    el.style.fontSize = size + "px";
    canvasCtx.font = "400 " + size + "px " + fam;
    while (text.length > 1 && canvasCtx.measureText(text).width > avail) text = text.slice(1);   // keep the newest end visible
    return text;
  }
  var SCI_LABELS = { sin: ["sin", "sin⁻¹"], cos: ["cos", "cos⁻¹"], tan: ["tan", "tan⁻¹"], ln: ["ln", "eˣ"], log: ["log", "10ˣ"], sqrt: ["√", "x²"] };
  function paint() {
    var v = calc.view();
    var avail = $("display-area").clientWidth - 48;
    $("main").textContent = fitText($("main"), v.main, avail);
    $("main").className = v.evaluated ? "res" : "";
    $("history").textContent = v.sub;
    $("banner-force").style.display = v.banner === "force" ? "block" : "none";
    $("banner-settings").style.display = v.banner === "settings" ? "block" : "none";
    $("btn-ac").textContent = v.ac;
    var i = v.inv ? 1 : 0;
    $("k-sin").textContent = SCI_LABELS.sin[i]; $("k-cos").textContent = SCI_LABELS.cos[i]; $("k-tan").textContent = SCI_LABELS.tan[i];
    $("k-ln").textContent = SCI_LABELS.ln[i]; $("k-log").textContent = SCI_LABELS.log[i]; $("k-sqrt").textContent = SCI_LABELS.sqrt[i];
    $("k-deg").textContent = v.deg ? "Deg" : "Rad";
    $("k-inv").className = "fn" + (v.inv ? " on" : "");
    if ($("histpanel").classList.contains("open")) paintPanel(v);
  }

  // ---------- history panel, menu, scientific keys ----------
  function paintPanel(v) {
    var top = $("hp-top"), h = loadHist();
    top.innerHTML = "";
    if (!h.length) { var n = document.createElement("div"); n.className = "none"; n.textContent = "No history"; top.appendChild(n); }
    else {
      var d = document.createElement("div"); d.className = "day"; d.textContent = "Today"; top.appendChild(d);
      h.forEach(function (x) {
        var it = document.createElement("div"); it.className = "it";
        var e = document.createElement("div"); e.className = "e"; e.textContent = x.e;
        var r = document.createElement("div"); r.className = "r"; r.textContent = x.r;
        it.appendChild(e); it.appendChild(r); top.appendChild(it);
      });
      top.scrollTop = top.scrollHeight;
    }
    $("hp-m").textContent = v.main; $("hp-m").className = "m" + (v.evaluated ? " res" : ""); $("hp-s").textContent = v.sub;
  }
  function togglePanel(open) {
    var p = $("histpanel");
    if (open === undefined) open = !p.classList.contains("open");
    if (open) { p.style.height = $("keys").getBoundingClientRect().top + "px"; p.classList.add("open"); closeMenu(); paintPanel(calc.view()); }
    else p.classList.remove("open");
    $("btn-hist").className = "tb" + (open ? " on" : "");
  }
  function closeMenu() { $("menu").classList.remove("open"); $("btn-menu").className = "tb"; }
  $("btn-hist").addEventListener("click", function () { togglePanel(); });
  $("btn-menu").addEventListener("click", function (e) {
    e.stopPropagation();
    var m = $("menu"), open = !m.classList.contains("open");
    if (open) { togglePanel(false); m.classList.add("open"); } else m.classList.remove("open");
    $("btn-menu").className = "tb" + (open ? " on" : "");
  });
  Array.prototype.forEach.call(document.querySelectorAll("#menu div"), function (it) {
    it.addEventListener("click", function () { if (it.getAttribute("data-m") === "clear") { saveHist([]); paint(); } closeMenu(); });
  });
  document.addEventListener("click", function (e) { if (!$("menu").contains(e.target) && e.target !== $("btn-menu")) closeMenu(); });
  $("expander").addEventListener("click", function () {
    var on = document.body.classList.toggle("sci");
    $("exp-path").setAttribute("d", on ? "M7 5l5 5 5-5M7 19l5-5 5 5" : "M7 9l5-5 5 5M7 15l5 5 5-5");
    if ($("histpanel").classList.contains("open")) togglePanel(true);
    paint();
  });

  // ---------- buttons ----------
  Array.prototype.forEach.call(document.querySelectorAll("button[data-k]"), function (b) {
    b.addEventListener("click", function () { calc.handleInput(b.getAttribute("data-k")); paint(); });
  });

  // ---------- display gestures: 5 quick taps, and a long-press (swallowing the click it would produce) ----------
  var hit = $("hit"), lpTimer = null, lpFired = false, lpX = 0, lpY = 0;
  hit.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  hit.addEventListener("pointerdown", function (e) {
    lpFired = false; lpX = e.clientX; lpY = e.clientY;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function () { lpFired = calc.displayLongPress(); paint(); }, 500);
  });
  function endPress() { clearTimeout(lpTimer); }
  hit.addEventListener("pointerup", endPress);
  hit.addEventListener("pointercancel", function () { endPress(); lpFired = false; });
  hit.addEventListener("pointermove", function (e) {
    if (Math.abs(e.clientX - lpX) > 12 || Math.abs(e.clientY - lpY) > 12) endPress();
  });
  hit.addEventListener("click", function () {
    if (lpFired) { lpFired = false; return; }
    calc.displayTap(); paint();
  });

  // ---------- leaving / returning ----------
  function leave() { calc.flushOnLeave(); releaseLockIfIdle(); }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") leave();
    else {
      var now = Date.now();
      waiting.filter(function (r) { return r.due <= now; }).forEach(function (r) { clearTimeout(r.id); r.fn(); });
      if (waiting.length) acquireLock();
      paint();
    }
  });
  window.addEventListener("pagehide", leave);
  window.addEventListener("resize", paint);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  paint();
  window.__calc = calc; // for automated tests only
})();
</script>
</body>
</html>
