<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Notary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="notary">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #F4F3EF; --surface: #FFFFFF; --text: #202124; --text-dim: #5F6368;
    --border: #E0E0E0; --accent: #F9AB00; --danger: #C5221F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124; --surface: #2D2E30; --text: #E8EAED;
      --text-dim: #9AA0A6; --border: #3C4043; --accent: #F9AB00; --danger: #F28B82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #202124; --surface: #2D2E30; --text: #E8EAED;
    --text-dim: #9AA0A6; --border: #3C4043; --accent: #F9AB00; --danger: #F28B82;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: Roboto, -apple-system, "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; position:relative; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); }

  header { box-sizing:border-box; height:64px; padding:14px 14px 10px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  header h1 { font-size:19px; font-weight:500; margin:0; user-select:none; flex-shrink:0; line-height:1; display:flex; align-items:center; }
  .mode-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:7px; vertical-align:middle; }
  .back-btn { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 8px;
    margin-left:-6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .back-icon { display:block; }
  .groupview-title-input { font-size:17px; font-weight:500; margin:0; flex:1; min-width:0; width:auto; border:none !important;
    background:transparent !important; box-shadow:none !important; color:var(--text); padding:4px 0 !important;
    font-family:inherit; text-overflow:ellipsis; }
  .groupview-title-input:focus { outline:none; }
  .header-menu-btn { background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:4px 10px;
    display:flex; align-items:center; justify-content:center; }
  .spacer { flex:1; }
  .photo-carousel-wrap { margin:12px 0; }
  .photo-carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    border-radius:12px; gap:0; scrollbar-width:none; }
  .photo-carousel::-webkit-scrollbar { display:none; }
  .photo-slide { position:relative; flex:0 0 100%; scroll-snap-align:start; cursor:zoom-in; }
  .photo-slide img { width:100%; max-height:340px; object-fit:cover; display:block; border-radius:12px; }
  .photo-remove { position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .photo-tag-btn { position:absolute; bottom:8px; left:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,0.45); border:2px solid rgba(255,255,255,0.85); color:#fff; font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .photo-tag-btn.active { outline:3px solid var(--accent); outline-offset:1px; }
  .photo-slide-text { display:flex; align-items:center; justify-content:center; min-height:180px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; box-sizing:border-box; }
  .photo-slide-text-inner { font-size:22px; font-weight:600; text-align:center; color:var(--text); word-break:break-word; }
  .photo-dots { display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .photo-dot { width:6px; height:6px; border-radius:50%; background:var(--border); }
  .photo-dot.active { background:var(--accent); }
  .image-viewer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:9500;
    display:flex; align-items:center; justify-content:center; touch-action:none; }
  .image-viewer-stage { position:relative; width:100%; height:100%; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  .image-viewer-stage img { max-width:92%; max-height:92%; object-fit:contain; touch-action:none;
    transition:transform 0.15s ease-out; will-change:transform; -webkit-user-drag:none; }
  .image-viewer-close { position:fixed; top:16px; right:16px; z-index:9600; background:rgba(255,255,255,0.15);
    border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .image-viewer-nav { position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.15);
    border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:22px; cursor:pointer; z-index:9600;
    display:flex; align-items:center; justify-content:center; }
  .image-viewer-prev { left:12px; }
  .image-viewer-next { right:12px; }
  .image-viewer-dots { position:fixed; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:9600; }
  .image-viewer-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.4); }
  .image-viewer-dot.active { background:#fff; }
  .card-photo-count { position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.6); color:#fff;
    font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px; }
  .fab-secondary { position:absolute; bottom:20px; right:18px; width:52px; height:52px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:22px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,0.28); cursor:pointer; z-index:20; }
  .header-search { flex:1; border:1px solid var(--border); background:var(--surface); border-radius:999px;
    padding:9px 14px; font-size:14px; color:var(--text); outline:none; font-family:inherit; }
  .header-search::placeholder { color:var(--text-dim); }
  .icon-btn { background:none; border:none; color:var(--text); font-size:19px; cursor:pointer; padding:4px 6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; }

  .body-scroll { flex:1; overflow-y:auto; padding:4px 12px 90px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  .card { position:relative; border-radius:10px; padding:12px; min-width:0; overflow:hidden;
    border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--text);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  /* A trick/group note is a stack of notes, so it gets a second sheet peeking out behind it. */
  .card.card-group { box-shadow: 3px 3px 0 0 var(--border); margin-right:2px; margin-bottom:2px; }
  .card-title { font-weight:700; font-size:15px; margin-bottom:4px; padding-right:22px; overflow-wrap:break-word; word-break:break-word; }
  .card-preview { font-size:13px; line-height:1.4; color:inherit; opacity:0.85; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; }
  .card-meta { font-size:11.5px; color:inherit; opacity:0.65; margin-top:6px; }
  .pill { display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:999px;
    background:rgba(0,0,0,0.12); margin-left:6px; }
  .card-menu-btn { position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,0.08); border:none; color:var(--text-dim); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:5; line-height:1; }
  .title-dot { color:inherit; }
  .title-dot.locked { color:var(--text-dim); font-size:0.92em; }
  .card.card-reorder-mode { touch-action:none; cursor:grab; }
  .reorder-drop-line { position:fixed; background:var(--accent); z-index:998; border-radius:2px; pointer-events:none; }
  .reorder-drop-line-v { width:3px; }
  .reorder-drop-line-h { height:3px; }
  .card.card-selected { box-shadow:0 0 0 2px var(--accent) inset; }
  .card.card-no-force { box-shadow:0 0 0 2px var(--danger) inset; }
  .card-select-check { position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    background:var(--accent); color:#202124; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; z-index:6; }
  .multiselect-bar { position:absolute; left:0; right:0; bottom:0; background:var(--surface);
    border-top:1px solid var(--border); padding:10px 12px; display:flex; align-items:center;
    gap:8px; flex-wrap:wrap; z-index:30; }
  .multiselect-count { font-size:13px; color:var(--text-dim); flex:1; }
  .multiselect-actions { display:flex; gap:6px; flex-wrap:wrap; }

  .fab { position:absolute; bottom:20px; right:18px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#202124; border:none; font-size:28px; line-height:1; padding:0;
    box-shadow:0 3px 10px rgba(0,0,0,0.28); cursor:pointer; z-index:20;
    display:flex; align-items:center; justify-content:center; }

  .fab-menu-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.35); z-index:40; }
  .fab-menu { position:absolute; bottom:86px; right:18px; display:flex; flex-direction:column;
    align-items:flex-end; gap:10px; z-index:50; }
  .fab-pill { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:11px 18px; font-size:14.5px; font-weight:600; color:var(--text);
    box-shadow:0 3px 10px rgba(0,0,0,0.25); cursor:pointer; white-space:nowrap; }
  .fab-pill-icon { font-size:15px; }
  .fab-close-btn { width:52px; height:52px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text);
    box-shadow:0 3px 10px rgba(0,0,0,0.25); cursor:pointer; }

  .empty { padding:70px 30px; text-align:center; color:var(--text-dim); font-size:14px; line-height:1.6; }

  .section-label { font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); margin:20px 0 8px; }
  .field-hint { font-size:12.5px; color:var(--text-dim); margin:4px 0 0; line-height:1.4; }
  input[type=text], input[type=number], select, textarea {
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 11px; color:var(--text); font-family:inherit; font-size:14.5px; outline:none;
  }
  textarea { resize:vertical; min-height:140px; line-height:1.5; }

  .row-flex { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .swatch { width:30px; height:30px; border-radius:50%; border:2px solid var(--border); cursor:pointer; position:relative; }
  .swatch.selected { border-color:var(--text); border-width:3px; }
  .swatch.selected::after { content:"\2713"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:#000; text-shadow:0 0 3px rgba(255,255,255,0.8); }

  .switch { position:relative; width:44px; height:26px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:0.15s; }
  .slider::before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px;
    background:var(--surface); border-radius:50%; transition:0.15s; box-shadow:0 1px 2px rgba(0,0,0,0.3); }
  input:checked + .slider { background:var(--accent); }
  input:checked + .slider::before { transform:translateX(18px); }

  .btn { display:inline-block; border:none; border-radius:8px; padding:10px 14px; font-size:14px;
    font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary { background:var(--accent); color:#202124; }
  .btn-ghost { background:var(--surface); color:var(--text); border:1px solid var(--border); }
  .btn-danger { background:none; color:var(--danger); border:1px solid var(--danger); }
  .btn-sm { padding:6px 10px; font-size:12.5px; }
  .btn-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }

  .note-row-item { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 0; border-bottom:1px solid var(--border); }
  .note-row-item .snippet { font-size:13.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pool-value-input { font-size:13.5px; flex:1; min-width:0; background:transparent; border:none; border-bottom:1px solid transparent;
    color:var(--text); font-family:inherit; padding:4px 0; }
  .pool-value-input:focus { outline:none; border-bottom-color:var(--accent); }
  .pool-value-image-thumb { width:36px; height:36px; object-fit:cover; border-radius:6px; flex-shrink:0; cursor:pointer; }

  .drag-handle { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    cursor:grab; color:var(--text-dim); font-size:16px; line-height:1; flex-shrink:0; padding:6px; }
  .settings-menu-row { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:18px 4px; border-bottom:1px solid var(--border); font-size:17px; cursor:pointer; }
  .settings-menu-row .snippet { font-size:17px; }

  .cat-name-suggest { position:absolute; top:calc(100% + 2px); left:0; right:0; z-index:40;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    max-height:180px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.2); }
  .cat-name-suggest-item { padding:11px 13px; font-size:14.5px; }
  .cat-name-suggest-item:active { background:var(--bg); }

  .cat-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .cat-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .cat-name { flex:1; font-size:14px; }

  .chip-row { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .chip { border-radius:999px; padding:6px 12px; font-size:12.5px; border:1px solid var(--border);
    cursor:pointer; background:var(--surface); color:var(--text); flex-shrink:0; }
  .editor-bottom-bar { position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--surface);
    border-top:1px solid var(--border); }
  .tag-chip-bar { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 12px 8px; }
  .tag-chip-bar .chip { white-space:nowrap; }

  .tag-span { border-radius:4px; padding:0 3px; }

  .status-line { margin-top:16px; padding:9px 12px; border-radius:8px; background:rgba(249,171,0,0.18); font-size:13px; }

  .rule-card { border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface); }
  .rule-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .rule-grid > * { flex:1; min-width:110px; }

  .editor-wrap { flex:1; display:flex; flex-direction:column; padding:8px 20px 24px; overflow-y:auto; }
  .title-input { border:none !important; background:transparent !important; box-shadow:none !important;
    font-size:26px; font-weight:700; padding:8px 0 !important; flex-shrink:0; resize:none; overflow:hidden;
    font-family:inherit; white-space:pre-wrap; word-wrap:break-word; line-height:1.3; display:block; width:100%; min-height:0; }
  .title-input:focus { outline:none; }
  .body-textarea { border:none !important; background:transparent !important;
    font-size:16.5px; font-weight:400; line-height:1.65; flex:1; min-height:180px; padding:8px 0 !important; resize:none;
    font-family:inherit; white-space:pre-wrap; word-wrap:break-word; letter-spacing:normal; }
  .body-textarea:focus { outline:none; }
  .body-editor-wrap { position:relative; flex:1; min-height:180px; }
  .body-highlight-overlay { position:absolute; inset:0; pointer-events:none; overflow-y:auto;
    white-space:pre-wrap; word-wrap:break-word; font-size:16.5px; font-weight:400; line-height:1.65;
    padding:8px 0; color:var(--text); font-family:inherit; }
  .body-textarea.with-overlay { position:absolute; inset:0; color:transparent !important; caret-color:var(--text); }
  .fmt-btn { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px;
    width:32px; height:32px; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .fmt-btn:active { background:var(--border); }
  .draw-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0 8px; flex-shrink:0; }
  .draw-swatch-row { display:flex; gap:8px; flex-wrap:wrap; }
  .draw-swatch { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); cursor:pointer; position:relative; flex-shrink:0; }
  .draw-swatch.selected { border-color:var(--text); border-width:3px; }
  .draw-tool-active { background:var(--accent) !important; color:#202124; border-color:var(--accent) !important; }
  .editor-extra { flex-shrink:0; }
  .forced-badge { display:inline-block; font-size:11.5px; background:rgba(249,171,0,0.25); padding:3px 9px;
    border-radius:999px; margin-bottom:10px; }
  .body-forced-image { font-size:17px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .body-forced-image img { max-width:100%; border-radius:12px; display:block; margin:10px 0; }
  .forced-inline-image { cursor:zoom-in; }

  .list-items-wrap { flex:1; overflow-y:auto; margin-top:8px; }
  .list-item-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); }
  .list-item-num { font-weight:700; cursor:pointer; min-width:26px; color:var(--accent); user-select:none; }
  .list-item-text { flex:1; border:none !important; background:transparent !important; font-size:15px; padding:4px 0 !important; }

  #global-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:#202124; color:#fff; padding:9px 16px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:0.2s; z-index:999; }
  #global-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #confirm-dialog { position:fixed; inset:0; z-index:10000; display:none; align-items:center; justify-content:center; }
  #confirm-dialog.show { display:flex; }
  .confirm-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.5); }
  .confirm-box { position:relative; background:var(--surface); border-radius:14px; padding:20px;
    max-width:300px; width:85%; box-shadow:0 10px 30px rgba(0,0,0,0.35); }
  .confirm-message { font-size:15px; margin-bottom:16px; color:var(--text); }
  .confirm-actions { display:flex; justify-content:flex-end; gap:10px; }
  #dial-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:9999; opacity:0; transition:opacity 0.12s; }
  #dial-overlay.show { opacity:1; }
  .dial-value { background:rgba(0,0,0,0.78); color:#fff; font-size:38px; font-weight:700;
    padding:22px 40px; border-radius:18px; text-align:center; min-width:100px; letter-spacing:2px; }
  .dial-active-digit { color:var(--accent); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:4px; }
  .dial-placeholder-digit { opacity:0.35; }
  .dial-edge-zone { position:fixed; top:56px; bottom:0; width:40px; z-index:8000;
    background:transparent; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .dial-edge-left { left:0; }
  .dial-edge-right { right:0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var STORAGE_KEY = "keep_force_state_v8";
  // A bold chevron (just the two lines that meet at a point) instead of a full arrow
  // glyph with a shaft, used for every back button in the app.
  var BACK_ARROW_SVG = '<svg class="back-icon" viewBox="0 0 10 16" width="10" height="16" fill="none" aria-hidden="true">' +

        "<b>Magic mode</b> reveals the setup tools: categories, pools, the dial, and forcing rules. Switch modes from Settings, or by tapping the \u201Cnotary.\u201D logo on Home if the dial shortcut is enabled."
      )) +
      docSection("Groups", docP(
        "A group is one trick or routine \u2014 a folder of notes plus the categories and force rules that tie them together. Open a group and arm its force (in Magic mode) so that opening notes in front of an audience (in Note mode) can trigger forced content."
      )) +
      docSection("Categories & forcing", docP(
        "A category marks a word or phrase inside a note's text (e.g. \u201CCARD\u201D) as something that gets swapped out. Link a category to a fixed word, or to a <b>pool</b> for a value that changes each performance. " +
        "Give a category a <b>trigger count</b> \u2014 the Nth note opened in a session \u2014 to control exactly when its force fires."
      )) +
      docSection("Pools", docP(
        "A pool is a reusable list of values (words, or images) that a category can pull from. A single-column pool holds one value per row \u2014 text, an image, or a mix of both. " +
        "A multi-column pool (e.g. rank + suit) combines several columns into one value and is text-only. Pools are shared across groups, so build one deck or list once and reuse it anywhere."
      )) +
      docSection("The dial", docP(
        "The dial lets you privately load a pool value before a note is opened, so the forced content matches something you (or a confederate) already know \u2014 a peeked card, a freely-chosen number, and so on. " +
        "Turn it on in Magic settings, then hold an edge of the screen in a group to bring up the dial overlay. Choose <b>auto-cycle</b> to have values advance on their own, or <b>drag to scrub</b> to move through them by touch. " +

      )) +
      docSection("Images in notes", docP(
        "Add a photo to any note and it appears inline, with room for text before and after it. Tap a photo to open it full-screen, where you can double-tap or pinch to zoom and pan. Add several photos to a note and they become a swipeable carousel with position dots."
      )) +
      docSection("Images as forces", docP(
        "A single-column pool can hold images instead of (or alongside) text. Link a category to that pool and its forced value can be a picture \u2014 handy for dialing through a set of card faces or other visual references. " +

      docSection("Export & import", docP(

    return (

        '<div class="body-scroll">' + body + '</div>' +
      '</div>'

  function editorMenuBtnHtml() {

  // An inserted photo can be tagged to a category, the same idea as tagging a word in
  // text: when that category fires, the tagged photo is swapped for whatever it forces
  // \u2014 another image, or (if the pool value is plain text) that text shown in its place.
  // forceRules, when given, is the active force's rule list (note is being viewed forced);
  // with no forceRules, every photo shows as inserted and stays editable/removable/taggable.
  function resolvedImageSlides(note, forceRules) {
    return (note.images || []).map(function (img) {
      if (forceRules && img.taggedCategoryId) {
        var rule = forceRules.find(function (r) { return r.categoryId === img.taggedCategoryId; });
        if (rule) {
          return isImageValue(rule.word)
            ? { kind: "image", dataUrl: rule.word.dataUrl, srcImage: img }
            : { kind: "text", text: rule.word, srcImage: img };
        }
      }
      return { kind: "image", dataUrl: img.dataUrl, srcImage: img };
    });
  }
  // Photos render large and inline in the note itself (not a strip of tiny thumbnails),
  // as a single big image or, with more than one, a swipeable carousel with dots \u2014 tapping
  // any of them opens the full-screen zoom viewer.
  function renderAttachmentsHtml(note, group, forceRules) {
    var slidesData = resolvedImageSlides(note, forceRules);
    var editable = !forceRules; // viewing a forced note is read-only for attachments too
    var cats = (group && group.categories) || [];
    var photosBlock = "";
    if (slidesData.length) {
      var imgIdx = 0;
      var slides = slidesData.map(function (s) {
        if (s.kind === "text") {
          return '<div class="photo-slide photo-slide-text"><div class="photo-slide-text-inner">' + esc(s.text) + '</div></div>';
        }
        var thisIdx = imgIdx++;
        var taggedCat = s.srcImage.taggedCategoryId ? cats.find(function (c) { return c.id === s.srcImage.taggedCategoryId; }) : null;
        var tagBtn = (editable && isMagic() && cats.length)
          ? '<button class="photo-tag-btn' + (selectedImageForTag === s.srcImage.id ? " active" : "") + '" data-tag-photo="' + s.srcImage.id + '"' +
              (taggedCat ? ' style="background:' + taggedCat.color + ';"' : '') +
              ' title="' + (taggedCat ? "Tagged: " + esc(taggedCat.name) : "Tag this image for a force") + '">\u25C9</button>'
          : "";
        return '<div class="photo-slide" data-view-photo="' + thisIdx + '">' +
            '<img src="' + s.dataUrl + '">' +
            (editable ? '<button class="photo-remove" data-remove-photo="' + s.srcImage.id + '">\u00D7</button>' : "") +
            tagBtn +
          '</div>';
      }).join("");
      var dots = slidesData.length > 1
        ? '<div class="photo-dots">' + slidesData.map(function (_, idx) { return '<div class="photo-dot' + (idx === 0 ? " active" : "") + '" data-dot="' + idx + '"></div>'; }).join("") + '</div>'
        : "";
      photosBlock = '<div class="photo-carousel-wrap">' +
          '<div class="photo-carousel" id="photo-carousel">' + slides + '</div>' +
          dots +
        '</div>';
    }
    return (
      photosBlock +
      (editable ? '<input type="file" accept="image/*" id="photo-input" style="display:none;">' : "")
    );
  }
  function bindAttachments(note, group, forceRules) {
    var editable = !forceRules;
    var photoInput = document.getElementById("photo-input");
    if (photoInput) {
      photoInput.addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var maxW = 1400;
            var scale = Math.min(1, maxW / img.width);
            var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL("image/jpeg", 0.88);
            note.images = note.images || [];
            note.images.push({ id: uid("img"), dataUrl: dataUrl, taggedCategoryId: null });
            saveState(); render();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    if (editable) {
      document.querySelectorAll("[data-remove-photo]").forEach(function (b) {
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          var id = b.getAttribute("data-remove-photo");
          note.images = (note.images || []).filter(function (i) { return i.id !== id; });
          if (selectedImageForTag === id) selectedImageForTag = null;
          saveState(); render();
        });
      });
      document.querySelectorAll("[data-tag-photo]").forEach(function (b) {
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          var id = b.getAttribute("data-tag-photo");
          selectedImageForTag = (selectedImageForTag === id) ? null : id;
          if (selectedImageForTag && isMagic()) showToast("Tap a category below to tag this image \u2014 tap it again to untag");
          render();
        });
      });
    }
    document.querySelectorAll("[data-view-photo]").forEach(function (slide) {
      slide.addEventListener("click", function (e) {
        if (e.target.closest("[data-remove-photo]") || e.target.closest("[data-tag-photo]")) return;
        var idx = parseInt(slide.getAttribute("data-view-photo"), 10);
        var imageUrls = resolvedImageSlides(note, forceRules).filter(function (s) { return s.kind === "image"; }).map(function (s) { return s.dataUrl; });
        openImageViewer(imageUrls, idx);
      });
    });
    var carousel = document.getElementById("photo-carousel");
    var dotsWrap = document.querySelector(".photo-dots");
    if (carousel && dotsWrap) {
      carousel.addEventListener("scroll", function () {
        var idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
        dotsWrap.querySelectorAll(".photo-dot").forEach(function (d, i) { d.classList.toggle("active", i === idx); });
      });
    }
  }

  // ---------------- full-screen image viewer: zoom (double-tap) + swipe between photos ----------------
  function renderImageViewerOverlay() {
    var multi = imageViewerImages.length > 1;

      ? '<button class="image-viewer-nav image-viewer-prev" id="iv-prev">‹</button>' +

      ? '<div class="image-viewer-dots">' + imageViewerImages.map(function (_, i) {

      '<div class="image-viewer-overlay" id="image-viewer-overlay">' +

          '<img id="image-viewer-img" src="' + imageViewerImages[imageViewerIndex] + '" draggable="false">' +
        '</div>' +
        nav + dots +

  function bindImageViewer() {
    var overlay = document.getElementById("image-viewer-overlay");
    if (!overlay) return;
    var stage = document.getElementById("image-viewer-stage");
    var img = document.getElementById("image-viewer-img");
    var multi = imageViewerImages.length > 1;
    document.getElementById("image-viewer-close").addEventListener("click", closeImageViewer);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeImageViewer(); });
    var prevBtn = document.getElementById("iv-prev"), nextBtn = document.getElementById("iv-next");
    function goTo(idx) {
      if (idx < 0 || idx >= imageViewerImages.length) return;
      imageViewerIndex = idx; render();
    }
    if (prevBtn) prevBtn.addEventListener("click", function (e) { e.stopPropagation(); goTo(imageViewerIndex - 1); });
    if (nextBtn) nextBtn.addEventListener("click", function (e) { e.stopPropagation(); goTo(imageViewerIndex + 1); });

    // Zoom state lives only for this render cycle (reset whenever the viewer re-renders,
    // e.g. on switching images), applied via a CSS transform on the image itself.
    var MAX_ZOOM = 5;
    var scale = 1, panX = 0, panY = 0, lastTapTime = 0, dragging = false, dragStartX = 0, dragStartY = 0,
        panStartX = 0, panStartY = 0, moved = false;
    // Two-finger pinch tracks every active pointer by id so it can tell one-finger
    // pan/swipe apart from a two-finger pinch, and hand back to panning smoothly
    // when the person lifts one finger and keeps the other down.
    var activePointers = {};
    var pinching = false, pinchStartDist = 0, pinchStartScale = 1;
    function applyTransform() {
      img.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
      img.style.cursor = scale > 1 ? "grab" : "zoom-in";
    }
    function setZoom(z) {
      scale = Math.max(1, Math.min(MAX_ZOOM, z));
      if (scale === 1) { panX = 0; panY = 0; }
      applyTransform();
    }
    function pointerDist(ids) {
      var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }
    img.addEventListener("pointerdown", function (e) {
      try { img.setPointerCapture(e.pointerId); } catch (err) {}
      activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(activePointers);
      if (ids.length >= 2) {
        pinching = true; dragging = false; moved = true;
        pinchStartDist = pointerDist(ids.slice(0, 2)) || 1;
        pinchStartScale = scale;
      } else {
        pinching = false; dragging = true; moved = false;
        dragStartX = e.clientX; dragStartY = e.clientY;
        panStartX = panX; panStartY = panY;
      }
    });
    img.addEventListener("pointermove", function (e) {
      if (!activePointers[e.pointerId]) return;
      activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(activePointers);
      if (pinching && ids.length >= 2) {
        var dist = pointerDist(ids.slice(0, 2));
        setZoom(pinchStartScale * (dist / pinchStartDist));
        return;
      }
      if (!dragging) return;
      var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (scale > 1) {
        panX = panStartX + dx; panY = panStartY + dy;
        applyTransform();
      }
    });
    function endPointer(e) {
      delete activePointers[e.pointerId];
      try { img.releasePointerCapture(e.pointerId); } catch (err) {}
      var ids = Object.keys(activePointers);
      if (pinching) {
        if (ids.length >= 2) { pinchStartDist = pointerDist(ids.slice(0, 2)) || 1; pinchStartScale = scale; return; }
        pinching = false;
        if (scale <= 1.02) setZoom(1);
        if (ids.length === 1) {
          // One finger still down after a pinch — resume panning from here instead of dropping the gesture.
          dragging = true; moved = true;
          dragStartX = activePointers[ids[0]].x; dragStartY = activePointers[ids[0]].y;
          panStartX = panX; panStartY = panY;
        }
        return true; // signal caller: this was a pinch release, not a tap/swipe
      }
      return false;
    }
    img.addEventListener("pointerup", function (e) {
      var wasPinch = endPointer(e);
      var wasDragging = dragging;
      dragging = false;
      if (wasPinch) return;
      var now = Date.now();
      if (!moved && now - lastTapTime < 320) {
        // Double-tap: toggle zoom.
        setZoom(scale > 1 ? 1 : 2.5);
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;
      if (!moved && wasDragging) return; // single tap on the image itself does nothing (close is via backdrop/X)
      if (scale === 1 && moved && multi) {
        var dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 60) { goTo(imageViewerIndex + (dx < 0 ? 1 : -1)); return; }
      }
    });
    img.addEventListener("pointercancel", endPointer);
    img.addEventListener("dblclick", function (e) { e.preventDefault(); });
    document.addEventListener("keydown", function onKey(e) {
      if (!document.getElementById("image-viewer-overlay")) { document.removeEventListener("keydown", onKey); return; }
      if (e.key === "Escape") closeImageViewer();
      else if (e.key === "ArrowLeft") goTo(imageViewerIndex - 1);
      else if (e.key === "ArrowRight") goTo(imageViewerIndex + 1);
    });
    applyTransform();
  }

  // ---------------- gesture handling: tap / long-press / drag-reorder ----------------
  function attachLongPress(el, onLong, onShort, ms) {
    var timer = null, isLongHold = false, moved = false, startX = 0, startY = 0;
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      isLongHold = false; moved = false;
      startX = e.clientX; startY = e.clientY;
      clearTimeout(timer);
      timer = setTimeout(function () { isLongHold = true; }, ms);
    });
    el.addEventListener("pointermove", function (e) {
      if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
        moved = true; clearTimeout(timer);
      }
    });
    el.addEventListener("pointerup", function () {
      clearTimeout(timer);
      if (isLongHold) { isLongHold = false; onLong(); }
      else if (!moved && onShort) { onShort(); }
    });
    el.addEventListener("pointercancel", function () {
      clearTimeout(timer); isLongHold = false;
    });
  }

  function attachCardGesture(el, opts) {
    // Two drag modes:
    // - handleSelector given (category rows, pool values, group cards): grabbing that
    //   dedicated handle drags immediately — it has touch-action:none baked into its own
    //   CSS from render, which native scroll can't preempt.
    // - no handleSelector (note cards): press and HOLD the whole card first (same
    //   duration as a long-press); only once that hold completes does further movement
    //   turn into a drag. Early movement (before the hold completes) is left alone as an
    //   ordinary scroll. Holding still and releasing without ever dragging fires the
    //   existing long-press options instead — decided at release, since by then we know
    //   for certain whether a drag happened.
    var pressTimer = null, holdComplete = false, dragging = false, startX = 0, startY = 0,
        clone = null, dragStartLeft = 0, dragStartTop = 0, moved = false, skip = false, handleGrab = false,
        dropLine = null, dragAfter = false;
    var LONG_MS = opts.longPressMs || 500;
    var MOVE_THRESHOLD = 10;
    var DRAG_THRESHOLD = 6; // smaller once the hold has already established intent

    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // Shows a thin line between the two cards the dragged item would land between —
    // on whichever edge of the hovered card the pointer is closer to. Grid layouts
    // (the note/group cards) split left/right; plain vertical lists (drag-handle
    // rows) split top/bottom.
    function removeDropLine() { if (dropLine) { dropLine.remove(); dropLine = null; } }
    function updateDropLine(clientX, clientY) {
      var elUnder = document.elementFromPoint(clientX, clientY);
      var target = elUnder && elUnder.closest("[data-drag-id]");
      if (!target || target === el) { removeDropLine(); return; }
      var rect = target.getBoundingClientRect();
      var isGrid = target.parentElement && getComputedStyle(target.parentElement).display === "grid";
      if (!dropLine) { dropLine = document.createElement("div"); dropLine.className = "reorder-drop-line"; document.body.appendChild(dropLine); }
      if (isGrid) {
        dragAfter = clientX > rect.left + rect.width / 2;
        dropLine.className = "reorder-drop-line reorder-drop-line-v";
        dropLine.style.top = rect.top + "px"; dropLine.style.height = rect.height + "px";
        dropLine.style.left = (dragAfter ? rect.right - 2 : rect.left - 1) + "px";
      } else {
        dragAfter = clientY > rect.top + rect.height / 2;
        dropLine.className = "reorder-drop-line reorder-drop-line-h";
        dropLine.style.left = rect.left + "px"; dropLine.style.width = rect.width + "px";
        dropLine.style.top = (dragAfter ? rect.bottom - 2 : rect.top - 1) + "px";
      }
    }

    function beginDrag(e) {
      dragging = true;
      var rect = el.getBoundingClientRect();
      dragStartLeft = rect.left; dragStartTop = rect.top;
      clone = el.cloneNode(true);
      clone.style.position = "fixed"; clone.style.left = rect.left + "px"; clone.style.top = rect.top + "px";
      clone.style.width = rect.width + "px"; clone.style.zIndex = "999"; clone.style.pointerEvents = "none";
      clone.style.boxShadow = "0 8px 20px rgba(0,0,0,0.35)"; clone.style.transform = "scale(1.03)"; clone.style.opacity = "0.92";
      document.body.appendChild(clone);
      el.style.opacity = "0.3";
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }

    el.addEventListener("pointerdown", function (e) {
      handleGrab = !!opts.wholeCardDrag || !!(opts.handleSelector && e.target.closest(opts.handleSelector));
      if (!handleGrab && (e.target.closest(".card-menu-btn") || e.target.closest("input,select,textarea,button,label"))) { skip = true; return; }
      skip = false; holdComplete = false; dragging = false; moved = false;
      startX = e.clientX; startY = e.clientY;
      clearTimeout(pressTimer);
      if (handleGrab) {
        // A dedicated handle (touch-action:none, baked into its own CSS) — safe to
        // start the drag immediately, no threshold needed since native scroll can't
        // claim this touch to begin with.
        e.preventDefault();
        moved = true;
        if (opts.dragId) beginDrag(e);
        return;
      }
      // No handle: don't preventDefault here. Calling it on pointerdown suppresses the
      // browser's native touch-scroll gesture for the whole touch before we've even seen
      // whether the user is scrolling or holding — which silently killed touch scrolling
      // (including the scroll-dial input) on any drag that starts on top of a card. Native
      // scroll now stays fully live from the first touch; we only preventDefault once we
      // actually commit to a drag, in pointermove below.
      pressTimer = setTimeout(function () {
        if (moved || dragging) return;
        holdComplete = true; // armed: a release now fires the long-press options, movement now starts a drag
      }, LONG_MS);
    });

    el.addEventListener("pointermove", function (e) {
      if (skip) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (dragging && clone) {
        clone.style.left = (dragStartLeft + dx) + "px";
        clone.style.top = (dragStartTop + dy) + "px";
        updateDropLine(e.clientX, e.clientY);
        return;
      }
      if (handleGrab) return; // handle drags start immediately in pointerdown; nothing to detect here
      if (!holdComplete) {
        // Before the hold completes, movement means the user is scrolling, not
        // holding — cancel the pending hold and leave native scroll alone.
        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
          moved = true;
          clearTimeout(pressTimer);
        }
        return;
      }
      if (!dragging && opts.dragId && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        e.preventDefault();
        beginDrag(e);
      }
    });

    el.addEventListener("pointerup", function (e) {
      if (skip) { skip = false; return; }
      clearTimeout(pressTimer);
      if (dragging) {
        var dropX = e.clientX, dropY = e.clientY;
        if (clone) { clone.remove(); clone = null; }
        el.style.opacity = "";
        dragging = false; handleGrab = false;
        var elUnder = document.elementFromPoint(dropX, dropY);
        var targetCard = elUnder && elUnder.closest("[data-drag-id]");
        if (targetCard) {
          var targetId = targetCard.getAttribute("data-drag-id");
          if (targetId !== opts.dragId && opts.onReorder) opts.onReorder(opts.dragId, targetId, dragAfter);
        }
        removeDropLine();
        return;
      }
      if (holdComplete) {
        // Held still, then released without dragging — the finger is already up,
        // so it's safe to mutate state and rebuild the DOM back to back here.
        holdComplete = false;
        if (opts.onLongPress) opts.onLongPress();
        if (opts.afterLongPress) opts.afterLongPress();
        return;
      }
      if (!moved && opts.onTap) opts.onTap();
    });

    el.addEventListener("pointercancel", function () {
      clearTimeout(pressTimer);
      if (clone) { clone.remove(); clone = null; }
      el.style.opacity = ""; dragging = false; handleGrab = false; holdComplete = false;
      removeDropLine();
    });
  }

            else autoTagGlobalPoolWords(note);
            saveState();
            if (isMagic() && note.tags.length < beforeCount) showToast("Tag removed \u2014 that word changed too much to keep it");
            if (isMagic()) refreshNoteEditor();
            rearmWordDial();
          }
        }
      });

      rearmWordDial();

      if (isMagic() && currentGroupId) {
        document.querySelectorAll("[data-tag-cat]").forEach(function (chip) {
          chip.addEventListener("mousedown", function (e) { e.preventDefault(); });
          chip.addEventListener("click", function () {
            var catId = chip.getAttribute("data-tag-cat");
            if (selectedImageForTag) {
              var img2 = (note.images || []).find(function (i) { return i.id === selectedImageForTag; });
              if (img2) {
                img2.taggedCategoryId = (img2.taggedCategoryId === catId) ? null : catId;
                saveState();
              }
              selectedImageForTag = null;
              render();
              return;
            }
            var start = ta.selectionStart, end = ta.selectionEnd;
            if (start === end) {
              var hit = (note.tags || []).find(function (t) { return t.categoryId === catId && start >= t.start && start <= t.end; });
              if (hit) { note.tags = note.tags.filter(function (t) { return t !== hit; }); saveState(); refreshNoteEditor(); rearmWordDial(); return; }
              start = lastSelStart; end = lastSelEnd;
            }
            if (start === end) { showToast("Select a word or phrase first"); return; }
            var overlap = (note.tags || []).some(function (t) { return !(end <= t.start || start >= t.end); });
            if (overlap) { showToast("That overlaps an existing tag"); return; }
            note.tags = note.tags || [];
            note.tags.push({ start: start, end: end, categoryId: catId });
            saveState(); refreshNoteEditor(); rearmWordDial();
          });
        });
      }
      }
    }

    if (route === "listEditor") {
      var lnote = getNote(currentGroupId, currentNoteId);
      document.getElementById("editor-back").addEventListener("click", goBack);
      bindTitleField(document.getElementById("note-title"), null);
      document.getElementById("note-title").addEventListener("input", function (e) { lnote.title = e.target.value; saveState(); });
      bindNoteMenuButtons();
      bindAttachments(lnote);
      document.querySelectorAll("[data-toggle-item]").forEach(function (el) {
        el.addEventListener("click", function () {
          var id = el.getAttribute("data-toggle-item");
          var item = (lnote.items || []).find(function (it) { return it.id === id; });
          item.done = !item.done; saveState(); render();
        });
      });
      var forcedPos = listForceTarget[lnote.id];
      document.querySelectorAll("[data-item-text]").forEach(function (inp) {
        var itemId = inp.getAttribute("data-item-text");
        var idx = parseInt(inp.getAttribute("data-item-idx"), 10);
        var isForcedRow = !!forcedPos && (idx + 1) === forcedPos;
        inp.addEventListener("input", function () {
          if (isForcedRow) {
            listForceOverrideText[lnote.id] = inp.value;
            return;
          }
          var item = (lnote.items || []).find(function (it) { return it.id === itemId; });
          item.text = inp.value; saveState();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var idx = lnote.items.findIndex(function (it) { return it.id === itemId; });
            var newItem = { id: uid("item"), text: "", done: false };
            lnote.items.splice(idx + 1, 0, newItem);
            saveState();
            focusItemIdAfterRender = newItem.id; focusItemCaretEnd = false;
            render();
          } else if (e.key === "Backspace" && inp.value === "" && inp.selectionStart === 0 && inp.selectionEnd === 0) {
            if (lnote.items.length > 1) {
              e.preventDefault();
              var idx2 = lnote.items.findIndex(function (it) { return it.id === itemId; });
              var prevId = idx2 > 0 ? lnote.items[idx2 - 1].id : null;
              lnote.items.splice(idx2, 1);
              saveState();
              focusItemIdAfterRender = prevId; focusItemCaretEnd = true;
              render();
            }
          }
        });
      });
      if (focusItemIdAfterRender) {
        var toFocus = document.querySelector('[data-item-text="' + focusItemIdAfterRender + '"]');
        if (toFocus) {
          toFocus.focus();
          if (focusItemCaretEnd) { var L = toFocus.value.length; toFocus.setSelectionRange(L, L); }
        }
        focusItemIdAfterRender = null; focusItemCaretEnd = false;
      }
      if (lnote.listForce && lnote.listForce.armed) armListForceDial(lnote);
      else dialClearSession();
    }

    if (route === "listForceSetup") {
      var lfNote = getNote(currentGroupId, currentNoteId);
      document.getElementById("lf-setup-back").addEventListener("click", goBack);
      document.getElementById("lf-word").addEventListener("input", function (e) {
        lfNote.listForce.word = e.target.value;
        saveState();
        var armedToggle = document.getElementById("lf-armed");
        var ready = !!e.target.value.trim();
        armedToggle.disabled = !ready;
        if (!ready) { armedToggle.checked = false; lfNote.listForce.armed = false; }
      });
      document.getElementById("lf-armed").addEventListener("change", function (e) { lfNote.listForce.armed = e.target.checked; saveState(); });
    }

    if (route === "poolsList") {
      document.getElementById("pools-back").addEventListener("click", goBack);
      document.getElementById("add-pool-btn").addEventListener("click", function () { poolFabMenuOpen = true; render(); });
      document.querySelectorAll("[data-pool]").forEach(function (card) {
        card.addEventListener("click", function () { openPoolEdit(card.getAttribute("data-pool")); });
      });
      var poolFabBackdrop = document.getElementById("pool-fab-backdrop");
      if (poolFabBackdrop) poolFabBackdrop.addEventListener("click", function () { poolFabMenuOpen = false; render(); });
      document.querySelectorAll("[data-add-pool-type]").forEach(function (pill) {
        pill.addEventListener("click", function () { addPoolFromTemplate(pill.getAttribute("data-add-pool-type")); });
      });
    }

    if (route === "poolEdit") {
      var pool = findPool(currentPoolId);
      var isMulti = !!(pool.columns && pool.columns.length >= 2);
      document.getElementById("pool-edit-back").addEventListener("click", goBack);
      document.getElementById("pool-name").addEventListener("input", function (e) { pool.name = e.target.value; saveState(); });
      document.getElementById("pool-multi-toggle").addEventListener("change", function (e) {
        if (e.target.checked) {
          pool.columns = [{ name: "", values: (pool.values || []).slice() }, { name: "", values: [] }];
        } else {
          pool.columns = null;
        }
        saveState(); render();
      });

      if (!isMulti) {
        document.querySelectorAll("[data-drag-id^='val:']").forEach(function (row) {
          attachCardGesture(row, {
            dragId: row.getAttribute("data-drag-id"),
            handleSelector: ".drag-handle",
            onReorder: function (draggedId, targetId, after) { reorderPoolValues(pool, draggedId, targetId, after); }
          });
        });
        document.querySelectorAll("[data-del-value]").forEach(function (b) {
          b.addEventListener("click", function () {
            var idx = parseInt(b.getAttribute("data-del-value"), 10);
            pool.values.splice(idx, 1);
            saveState(); render();
          });
        });
        // Edit an existing text value in place. Commit as the person types (so a
        // dial or force referencing this pool always sees the latest text), but only
        // enforce the duplicate/conflict checks on blur so mid-edit states don't get
        // rejected while they're still typing.
        document.querySelectorAll("[data-edit-value]").forEach(function (inp) {
          var idx = parseInt(inp.getAttribute("data-edit-value"), 10);
          var prevValue = pool.values[idx];
          inp.addEventListener("input", function () {
            pool.values[idx] = inp.value;
            saveState();
          });
          inp.addEventListener("blur", function () {
            var val = inp.value.trim();
            if (!val) { pool.values[idx] = prevValue; saveState(); render(); return; }
            var dup = pool.values.some(function (v, i) { return i !== idx && !isImageValue(v) && v.toLowerCase() === val.toLowerCase(); });
            if (dup) { showToast("Already in this pool"); pool.values[idx] = prevValue; saveState(); render(); return; }
            var conflict = poolValueConflict(pool.id, val);
            if (conflict) { showToast('"' + val + '" is already in "' + conflict.name + '"'); pool.values[idx] = prevValue; saveState(); render(); return; }
            pool.values[idx] = val;
            saveState();
          });
          inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
        });
        document.getElementById("add-pool-value-btn").addEventListener("click", function () {
          var input = document.getElementById("new-pool-value");
          var val = input.value.trim();
          if (!val) return;
          var dup = pool.values.some(function (v) { return !isImageValue(v) && v.toLowerCase() === val.toLowerCase(); });
          if (dup) { showToast("Already in this pool"); return; }
          var conflict = poolValueConflict(pool.id, val);
          if (conflict) { showToast('"' + val + '" is already in "' + conflict.name + '"'); return; }
          pool.values.push(val);
          saveState();
          input.value = "";
          render();
        });
        var poolImgBtn = document.getElementById("add-pool-image-btn");
        var poolImgInput = document.getElementById("pool-image-input");
        var poolImgEditIdx = null; // null = adding a new value; otherwise the index of the value being replaced
        function readAndStoreImage(file, onDataUrl) {
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              var maxW = 800;
              var scale = Math.min(1, maxW / img.width);
              var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
              var canvas = document.createElement("canvas");
              canvas.width = w; canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);
              onDataUrl(canvas.toDataURL("image/jpeg", 0.85));
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        }
        if (poolImgBtn && poolImgInput) {
          poolImgBtn.addEventListener("click", function () { poolImgEditIdx = null; poolImgInput.click(); });
          document.querySelectorAll("[data-edit-image-value]").forEach(function (thumb) {
            thumb.addEventListener("click", function () {
              poolImgEditIdx = parseInt(thumb.getAttribute("data-edit-image-value"), 10);
              poolImgInput.click();
            });
          });
          poolImgInput.addEventListener("change", function (e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            readAndStoreImage(file, function (dataUrl) {
              if (poolImgEditIdx != null && pool.values[poolImgEditIdx] != null) {
                var existing = pool.values[poolImgEditIdx];
                pool.values[poolImgEditIdx] = { type: "image", id: isImageValue(existing) ? existing.id : uid("img"), dataUrl: dataUrl };
              } else {
                pool.values.push({ type: "image", id: uid("img"), dataUrl: dataUrl });
              }
              poolImgInput.value = "";
              saveState(); render();
            });
          });
        }
      } else {
        document.querySelectorAll("[data-drag-id^='colval:']").forEach(function (row) {
          attachCardGesture(row, {
            dragId: row.getAttribute("data-drag-id"),
            handleSelector: ".drag-handle",
            onReorder: function (draggedId, targetId, after) { reorderPoolColumnValues(pool, draggedId, targetId, after); }
          });
        });
        document.getElementById("add-column-btn").addEventListener("click", function () {
          pool.columns.push({ name: "", values: [] });
          saveState(); render();
        });
        document.querySelectorAll("[data-del-column]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var ci = parseInt(btn.getAttribute("data-del-column"), 10);
            pool.columns.splice(ci, 1);
            if (pool.columns.length < 2) pool.columns = null;
            saveState(); render();
          });
        });
        document.querySelectorAll("[data-col-name]").forEach(function (inp) {
          var ci = parseInt(inp.getAttribute("data-col-name"), 10);
          inp.addEventListener("input", function () { pool.columns[ci].name = inp.value; saveState(); });
        });
        document.querySelectorAll("[data-add-col-value]").forEach(function (btn) {
          var ci = parseInt(btn.getAttribute("data-add-col-value"), 10);
          btn.addEventListener("click", function () {
            var input = document.querySelector('[data-new-col-value="' + ci + '"]');
            var val = input.value.trim();
            if (!val) return;
            var dup = pool.columns[ci].values.some(function (v) { return v.toLowerCase() === val.toLowerCase(); });
            if (dup) { showToast("Already in this column"); return; }
            var conflict = poolValueConflict(pool.id, val);
            if (conflict) { showToast('"' + val + '" is already in "' + conflict.name + '"'); return; }
            pool.columns[ci].values.push(val);
            saveState();
            input.value = "";
            render();
          });
        });
        document.querySelectorAll("[data-del-col-value]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var parts = btn.getAttribute("data-del-col-value").split(":");
            var ci = parseInt(parts[0], 10), vi = parseInt(parts[1], 10);
            pool.columns[ci].values.splice(vi, 1);
            saveState(); render();
          });
        });
        document.querySelectorAll("[data-edit-col-value]").forEach(function (inp) {
          var parts = inp.getAttribute("data-edit-col-value").split(":");
          var ci = parseInt(parts[0], 10), vi = parseInt(parts[1], 10);
          var prevValue = pool.columns[ci].values[vi];
          inp.addEventListener("input", function () {
            pool.columns[ci].values[vi] = inp.value;
            saveState();
          });
          inp.addEventListener("blur", function () {
            var val = inp.value.trim();
            if (!val) { pool.columns[ci].values[vi] = prevValue; saveState(); render(); return; }
            var dup = pool.columns[ci].values.some(function (v, i) { return i !== vi && v.toLowerCase() === val.toLowerCase(); });
            if (dup) { showToast("Already in this column"); pool.columns[ci].values[vi] = prevValue; saveState(); render(); return; }
            var conflict = poolValueConflict(pool.id, val);
            if (conflict) { showToast('"' + val + '" is already in "' + conflict.name + '"'); pool.columns[ci].values[vi] = prevValue; saveState(); render(); return; }
            pool.columns[ci].values[vi] = val;
            saveState();
          });
          inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
        });
        document.getElementById("pool-separator").addEventListener("input", function (e) {
          pool.columnSeparator = e.target.value; saveState();
        });
      }

      document.getElementById("delete-pool-btn").addEventListener("click", function () {
        showConfirm("Delete this pool? Any category using it will be unlinked.", function () { deletePool(currentPoolId); goBack(); });
      });
    }

    if (route === "settingsMenu") {
      document.getElementById("settings-menu-back").addEventListener("click", goBack);
      document.querySelectorAll("[data-settings-nav]").forEach(function (row) {
        row.addEventListener("click", function () {
          var target = row.getAttribute("data-settings-nav");
          if (target === "pools") openPoolsList();
          else if (target === "dial") openSettings();
          else if (target === "exportimport") { exportImportOutput = ""; openExportImport(); }
          else if (target === "docs") openDocs();
        });
      });
    }

    if (route === "docs") {
      document.getElementById("docs-back").addEventListener("click", goBack);
    }

    if (route === "exportImport") {
      document.getElementById("exportimport-back").addEventListener("click", goBack);
      function checkedGroupIds() {
        return Array.from(document.querySelectorAll("[data-export-group]:checked")).map(function (b) { return b.getAttribute("data-export-group"); });
      }
      var downloadBtn = document.getElementById("export-download-btn");
      if (downloadBtn) downloadBtn.addEventListener("click", function () {
        var checked = checkedGroupIds();
        var payload = buildExportPayload(checked.length ? checked : null);
        var text = exportPayloadToText(payload);
        var fname = checked.length === 1 ? safeFilename(findGroup(checked[0]).title) + ".json" : "notary-export.json";
        downloadsNS.save({ filename: fname, data: text })
          .then(function (r) { showToast(r.status === "saved" ? "Saved" : "Sent"); })
          .catch(function (err) { if (err && err.code !== "declined") showToast("Couldn't save \u2014 try the text option below"); });
      });
      document.getElementById("export-generate-btn").addEventListener("click", function () {
        var checked = checkedGroupIds();
        exportImportOutput = exportPayloadToText(buildExportPayload(checked.length ? checked : null));
        render();
      });
      var copyBtn = document.getElementById("export-copy-btn");
      if (copyBtn) copyBtn.addEventListener("click", function () {
        var ta = document.getElementById("export-output");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(function () { showToast("Copied"); }).catch(function () { ta.select(); showToast("Select failed \u2014 copy manually"); });
        } else { ta.select(); showToast("Selected \u2014 copy with your keyboard"); }
      });
      document.getElementById("import-file-btn").addEventListener("click", function () {
        document.getElementById("import-file-input").click();
      });
      document.getElementById("import-file-input").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var result = importPayloadFromText(String(reader.result || ""));
          if (!result.ok) { showToast(result.error); return; }
          showToast("Imported " + result.count + " trick" + (result.count === 1 ? "" : "s"));
          render();
        };
        reader.onerror = function () { showToast("Couldn't read that file"); };
        reader.readAsText(file);
      });
      document.getElementById("import-run-btn").addEventListener("click", function () {
        var text = document.getElementById("import-input").value.trim();
        if (!text) { showToast("Paste export text first"); return; }
        var result = importPayloadFromText(text);
        if (!result.ok) { showToast(result.error); return; }
        showToast("Imported " + result.count + " trick" + (result.count === 1 ? "" : "s"));
        render();
      });
    }

    if (route === "exportScreen") {
      document.getElementById("export-screen-back").addEventListener("click", goBack);
      var screenDownloadBtn = document.getElementById("export-screen-download-btn");
      if (screenDownloadBtn) screenDownloadBtn.addEventListener("click", function () {
        var group = exportScreenGroupId ? findGroup(exportScreenGroupId) : null;
        var text = document.getElementById("export-screen-output").value;
        var fname = group ? safeFilename(group.title) + ".json" : "notary-export.json";
        downloadsNS.save({ filename: fname, data: text })
          .then(function (r) { showToast(r.status === "saved" ? "Saved" : "Sent"); })
          .catch(function (err) { if (err && err.code !== "declined") showToast("Couldn't save \u2014 try copying the text instead"); });
      });
      document.getElementById("export-screen-copy-btn").addEventListener("click", function () {
        var ta = document.getElementById("export-screen-output");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(function () { showToast("Copied"); }).catch(function () { ta.select(); showToast("Select failed \u2014 copy manually"); });
        } else { ta.select(); showToast("Selected \u2014 copy with your keyboard"); }
      });
    }

    if (route === "settings") {
      document.getElementById("settings-back").addEventListener("click", function () { dialClearSession(); goBack(); });
      document.getElementById("dial-enabled").addEventListener("change", function () { toggleDialEnabled(); });
      document.querySelectorAll('input[name="dialmode"]').forEach(function (r) {
        r.addEventListener("change", function () { state.dialSettings.inputMode = r.value; saveState(); render(); });
      });
      document.getElementById("dial-haptics").addEventListener("change", function (e) { state.dialSettings.haptics = e.target.checked; saveState(); });
      document.getElementById("dial-invert").addEventListener("change", function (e) { state.dialSettings.invertDrag = e.target.checked; saveState(); });
      document.getElementById("dial-show-onscreen").addEventListener("change", function (e) { state.dialSettings.showOnScreen = e.target.checked; saveState(); });
      document.getElementById("dial-hold").addEventListener("input", function (e) {
        state.dialSettings.holdMs = parseInt(e.target.value, 10);
        saveState();
        document.getElementById("dial-hold-label").textContent = state.dialSettings.holdMs + "ms \u2014 how long you have to hold the edge before the dial opens.";
      });
      document.getElementById("dial-speed").addEventListener("input", function (e) {
        state.dialSettings.cycleSpeedMs = parseInt(e.target.value, 10);
        saveState();
        document.getElementById("dial-speed-label").textContent = state.dialSettings.cycleSpeedMs + "ms per step in auto-cycle. Higher is slower.";
      });
      document.getElementById("dial-haptic-strength").addEventListener("input", function (e) {
        state.dialSettings.hapticStrength = parseInt(e.target.value, 10);
        saveState();
        document.getElementById("dial-strength-label").textContent = state.dialSettings.hapticStrength + "ms buzz per step. Actual feel varies by device.";
        dialVibrate();
      });
      var poolSel = document.getElementById("dial-demo-pool");
      poolSel.addEventListener("change", function () {
        dialDemoPoolId = poolSel.value || null;
        dialDemoValue = "";
        render();
      });
      if (dialDemoPoolId) {
        var demoPool = findPool(dialDemoPoolId);
        if (demoPool) {
          armPoolColumnDial(demoPool, "demo", function (val) {
            dialDemoValue = val; render();
          });
        }
      }
    }

    if (route === "drawingEditor") {
      var dnote = getNote(currentGroupId, currentNoteId);
      document.getElementById("editor-back").addEventListener("click", goBack);
      bindTitleField(document.getElementById("note-title"), null);
      document.getElementById("note-title").addEventListener("input", function (e) { dnote.title = e.target.value; saveState(); });
      bindNoteMenuButtons();
      bindAttachments(dnote);
      var canvas = document.getElementById("draw-canvas");
      var rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width));
      canvas.height = Math.max(1, Math.round(rect.height));
      var ctx = canvas.getContext("2d");
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      function applyTool() {
        if (dnote.drawTool === "eraser") { ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = 16; }
        else { ctx.globalCompositeOperation = "source-over"; ctx.strokeStyle = dnote.drawColor || DRAW_COLORS[0]; ctx.lineWidth = 3; }
      }
      applyTool();
      if (dnote.drawingData) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
        img.src = dnote.drawingData;
      }
      var drawing = false;
      function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
      canvas.addEventListener("pointerdown", function (e) { drawing = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener("pointermove", function (e) { if (!drawing) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      ["pointerup","pointerleave","pointercancel"].forEach(function (ev) {
        canvas.addEventListener(ev, function () {
          if (drawing) { drawing = false; dnote.drawingData = canvas.toDataURL("image/png"); saveState(); }
        });
      });
      document.querySelectorAll("[data-draw-color]").forEach(function (sw) {
        sw.addEventListener("click", function () {
          dnote.drawTool = "pen";
          dnote.drawColor = sw.getAttribute("data-draw-color");
          saveState(); render();
        });
      });
      var eraserBtn = document.getElementById("draw-eraser-btn");
      if (eraserBtn) eraserBtn.addEventListener("click", function () {
        dnote.drawTool = dnote.drawTool === "eraser" ? "pen" : "eraser";
        saveState(); render();
      });
    }

    bindFabMenu(); bindNoteMenu(); bindMoveMenu();
  }

  window.addEventListener("popstate", function () { goBack(); });
  try { history.replaceState({ depth: 0 }, "", ""); } catch (e) {}
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
